.nav-icon { font-size: 20px; line-height: 1; }

@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }

.slide-in { animation: slideIn 0.3s ease forwards; }

// ── SVG HELPERS ───────────────────────────────────────────────────────────────

function DonutSegments({acts, size=130}) {
  const total = acts.filter(a=>a.mins>0).reduce((s,a)=>s+a.mins,0);
  if(!total) return null;
  const r=52, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  let offset=0;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#1e2535" strokeWidth={14}/>
      {acts.filter(a=>a.mins>0).map(a=>{
        const pct=a.mins/total;
        const dash=pct*circ;
        const dashOffset=-(offset/1)*circ/1;
        const el=(
          <circle key={a.id} cx={cx} cy={cy} r={r}
            fill="none" stroke={a.color} strokeWidth={13}
            strokeDasharray={`${dash} ${circ-dash}`}
            strokeDashoffset={-offset*circ}
            strokeLinecap="butt" opacity={0.9}/>
        );
        offset+=pct;
        return el;
      })}
    </svg>
  );
}

function Sparkline({data, color, width=120, height=36}) {
  if(!data||data.length<2) return null;
  const max=Math.max(...data), min=Math.min(...data);
  const range=max-min||1;
  const pts = data.map((v,i)=>[
    (i/(data.length-1))*width,
    height - ((v-min)/range)*(height-4)-2
  ]);
  const path = pts.map((p,i)=>`${i===0?'M':'L'} ${p[0]} ${p[1]}`).join(' ');
  const area = `${path} L ${width} ${height} L 0 ${height} Z`;
  return (
    <svg width={width} height={height} style={{overflow:'visible'}}>
      <defs>
        <linearGradient id={`sg-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity={0.3}/>
          <stop offset="100%" stopColor={color} stopOpacity={0}/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#sg-${color.replace('#','')})`}/>
      <path d={path} fill="none" stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i)=>(
        <circle key={i} cx={p[0]} cy={p[1]} r={i===pts.length-1?4:2.5}
          fill={i===pts.length-1?color:'#0d1117'} stroke={color} strokeWidth={1.5}/>
      ))}
    </svg>
  );
}

function MiniBarChart({labels, values, color, height=50}) {

function FeedScreen() {
  const todayStr = new Date().toISOString().split('T')[0];
  const weekDays = useMemo(()=>{
    const today=new Date(), dow=today.getDay()===0?6:today.getDay()-1;
    const mon=new Date(today); mon.setDate(today.getDate()-dow);
    return Array.from({length:7},(_,i)=>{
      const d=new Date(mon); d.setDate(mon.getDate()+i);
      return {
        date:d.toISOString().split('T')[0],
        dayNum:d.getDate(),
        dayName:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i],
        isToday:d.toISOString().split('T')[0]===todayStr,
        mood:WEEK_MOOD[i],
        energy:WEEK_ENERGY[i],
      };
    });
  },[]);

  return (
    <div className="scrollable" style={{padding:'0 0 20px'}}>
      <div style={{padding:'8px 20px 0'}}>
        <div className="label" style={{marginBottom:4}}>история</div>
        <div style={{fontFamily:'var(--display)',fontSize:22,fontWeight:700,color:'var(--fg)',marginBottom:14}}>
          Лента
        </div>

        {/* Week grid */}
        <div style={{
          background:'var(--bg2)',borderRadius:18,padding:'14px',
          border:'1px solid var(--border)',marginBottom:14
        }}>
          <div className="label" style={{marginBottom:10}}>эта неделя</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,marginBottom:8}}>
            {weekDays.map(d=>(
              <div key={d.date} style={{
                display:'flex',flexDirection:'column',alignItems:'center',gap:4,
                padding:'8px 4px',borderRadius:10,
                background:d.isToday?`${MC[d.mood]}15`:'transparent',
                border:`1px solid ${d.isToday?MC[d.mood]+'44':'transparent'}`,
                cursor:'pointer'
              }}>
                <span style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--fg3)'}}>{d.dayName}</span>
                <span style={{fontFamily:'var(--mono)',fontSize:11,color:d.isToday?MC[d.mood]:'var(--fg2)'}}>{d.dayNum}</span>
                <div style={{
                  width:24,height:24,borderRadius:'50%',
                  background:MC[d.mood],
                  display:'flex',alignItems:'center',justifyContent:'center',
                  color:'white',fontFamily:'var(--mono)',fontSize:10,fontWeight:600,
                  boxShadow:`0 0 8px ${MC[d.mood]}55`
                }}>{d.mood}</div>
                {/* Energy dot */}
                <div style={{
                  width:16,height:3,borderRadius:2,
                  background:`linear-gradient(90deg,#f59e0b,#f59e0b${Math.round(d.energy/10*255).toString(16).padStart(2,'0')})`,
                  opacity:0.7
                }}/>
              </div>
            ))}
          </div>
          {/* Dual sparkline */}
          <div style={{position:'relative',height:40,marginBottom:4}}>
            <Sparkline data={WEEK_MOOD} color={MC[7]} width={318} height={40}/>
            <div style={{position:'absolute',top:0,left:0}}>
              <Sparkline data={WEEK_ENERGY} color="#f59e0b" width={318} height={40}/>
            </div>
          </div>
        </div>

        {/* Summary */}
        <div style={{
          background:'var(--bg2)',borderRadius:18,padding:'14px',
          border:'1px solid var(--border)',marginBottom:14
        }}>
          <div className="label" style={{marginBottom:12}}>сводка недели</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[
              {icon:'😊',label:'Среднее настроение',v:'7.1/10',c:MC[7]},
              {icon:'😴',label:'Средний сон',v:'7.2ч',c:'#6366f1'},

                  <div style={{fontFamily:'var(--display)',fontSize:16,fontWeight:600,color:s.c}}>{s.v}</div>

                    transition:'width 0.5s ease'

                </div>
                <span style={{fontFamily:'var(--mono)',fontSize:9,color:a.color,width:28,textAlign:'right'}}>
                  {a.mins}м
                </span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
